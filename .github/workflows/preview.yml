name: Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - 'site/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install validation tooling
        run: npm install

      - name: Lint HTML
        run: npm run lint:html

      - name: Check links
        run: npm run check:links

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PREVIEW_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Mask AWS account ID
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::$ACCOUNT_ID"

      - name: Sync preview to S3
        run: aws s3 sync site/ s3://${{ secrets.SITE_BUCKET_NAME }}/previews/pr-${{ github.event.pull_request.number }}/ --delete

      - name: Invalidate CloudFront cache for this preview
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/previews/pr-${{ github.event.pull_request.number }}/*"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- preview-deployment-comment -->';
            const prNumber = context.issue.number;
            const url = `https://atconsultingllc.com/previews/pr-${prNumber}/index.html`;
            const body = `${marker}\n#### Preview deployment\n\nYour preview is ready: ${url}\n\n_Updated automatically on each push to this pull request._`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });
            const existing = comments.data.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body
              });
            }

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PREVIEW_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Mask AWS account ID
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::$ACCOUNT_ID"

      - name: Remove preview from S3
        run: aws s3 rm s3://${{ secrets.SITE_BUCKET_NAME }}/previews/pr-${{ github.event.pull_request.number }}/ --recursive

      - name: Invalidate CloudFront cache for this preview
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/previews/pr-${{ github.event.pull_request.number }}/*"

      - name: Update PR comment to note preview removal
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- preview-deployment-comment -->';
            const prNumber = context.issue.number;
            const body = `${marker}\n#### Preview deployment\n\nThis pull request's preview has been removed.`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });
            const existing = comments.data.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            }
